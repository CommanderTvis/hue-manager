# Build the native server image (linux/amd64) on every push to master and publish it to this forge's registry.
# Needs a runner with a Docker socket (label `docker`) and the automatic token, or a REGISTRY_TOKEN repo secret (package write) if that is not allowed to push.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  image:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v7
      - name: Build and push
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          image=git.iaroslav.casa/commandertvis/hue-manager
          echo "$REGISTRY_TOKEN" | docker login git.iaroslav.casa -u "$GITHUB_ACTOR" --password-stdin
          docker build --pull --platform linux/amd64 --build-arg BUILD_COMMIT="$GITHUB_SHA" \
            -t "$image:latest" -t "$image:sha-$GITHUB_SHA" .
          docker push --all-tags "$image"
